<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@400&family=Literata:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/onboarding.css">
    <link rel="stylesheet" href="./css/journey.css">
    <link rel="stylesheet" href="./css/calendar.css">
    <link rel="stylesheet" href="./css/add-flow.css">
    <link rel="stylesheet" href="./css/settings.css">
    <link rel="stylesheet" href="./css/item-actions.css">
    <link rel="stylesheet" href="./css/item-detail.css">
    <link rel="stylesheet" href="./css/button-states.css">
    <link rel="stylesheet" href="./css/device.css">
    <!-- Screens register themselves on window; app.js loads last and wires them together. -->
    <script defer src="./js/device.js"></script>
    <script defer src="./js/onboarding.js"></script>
    <script defer src="./js/journey.js"></script>
    <script defer src="./js/add-flow.js"></script>
    <script defer src="./js/settings.js"></script>
    <script defer src="./js/item-actions.js"></script>
    <script defer src="./js/item-detail.js"></script>
    <script defer src="./js/calendar.js"></script>
    <script defer src="./js/app.js"></script>
</head>
<body>
    <!-- On desktop-sized windows, device.css draws this as an iPhone; on phones it is a plain wrapper. -->
    <div class="device">
        <div class="device-screen">
            <main id="app">
                <div class="splash" aria-label="Pinch is loading">
                    <img src="./assets/pinch-logo.svg" alt="">
                    <h1>Pinch</h1>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
